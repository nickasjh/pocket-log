<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Log</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="Pocket Log">
<meta name="theme-color" content="#EAF2FF">
<script>
  // Your Apps Script web app URL (the one ending in /exec)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzAwiSktRshNDMJGayDEvcPRPB9a2ezWgerTvUnIMgx3I17_3zc5BlTDoS1uj6Q1y69/exec';

  // The Home Screen icon opens this page with ?go=1, which jumps straight to the app
  // in a normal browser tab, where you're already signed in to Google.
  var GO = /[?&]go=1/.test(window.location.search);
  if (GO) window.location.replace(APP_URL);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EAF2FF;--ink:#1F2A44;--soft:#5B6785;--card:#fff;--line:#D5E1F5}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
  body{font-family:'Fredoka',ui-rounded,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
  main{max-width:360px;width:100%;text-align:center}
  img{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 30px rgba(31,42,68,.15)}
  h1{font-size:30px;margin:18px 0 6px}
  p{color:var(--soft);margin:0 0 18px;line-height:1.45}
  [hidden]{display:none!important}
  ol{background:var(--card);border:2px solid var(--line);border-radius:20px;text-align:left;padding:16px 16px 16px 38px;margin:0 0 18px;line-height:1.6}
  a{display:block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:15px;border-radius:18px}
  a:focus-visible{outline:3px solid #FF6FA3;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Pocket Log icon">
  <h1>Pocket Log</h1>
  <p id="intro">Add this page to your Home Screen to get the app with its icon.</p>
  <ol id="steps">
    <li>Tap the share button (square with an arrow) in Chrome's address bar</li>
    <li>Tap <strong>Add to Home Screen</strong></li>
    <li>Tap <strong>Add</strong></li>
  </ol>
  <a id="open" href="#">Open Pocket Log</a>
</main>
<script>
  document.getElementById('open').href = APP_URL;
  if (GO) {
    document.getElementById('intro').textContent = 'Opening Pocket Log…';
    document.getElementById('steps').hidden = true;
  } else if (window.history && history.replaceState) {
    // Quietly add ?go=1 so the Home Screen shortcut saves the "open the app" address
    history.replaceState(null, '', window.location.pathname + '?go=1');
  }
</script>
</body>
</html>
